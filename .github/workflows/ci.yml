name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Core tests
        run: swift test --scratch-path build/swift
      - name: Release engine and native TLS fixture
        run: |
          swift build --scratch-path build/swift -c release
          xcrun swiftc -swift-version 5 Tools/TLSFixture/main.swift -o build/tls-fixture
      - name: Isolated loopback integration tests
        run: python3 scripts/integration.py
      - name: Universal 2 app and provider compilation
        run: |
          scripts/build-app.sh
          scripts/build-extension.sh
      - name: Prepare local review archive
        run: scripts/package-release.sh --existing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: MacDPI-verification-${{ runner.arch }}
          path: |
            build/reports/
            build/dist/
          retention-days: 14
  native-ui:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native model and UI lifecycle
        run: |
          runner_arch="$(uname -m)"
          xcodebuild -version
          xcodebuild -project MacDPI.xcodeproj -scheme MacDPI -configuration Debug \
            -derivedDataPath build/xcode CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES \
            -destination "platform=macOS,arch=$runner_arch" \
            -resultBundlePath build/reports/NativeUI.xcresult test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: MacDPI-native-ui
          path: build/reports/
          retention-days: 14
