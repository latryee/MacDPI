name: Prepare release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: swift test --scratch-path build/swift
      - run: python3 -m unittest discover -s Tests/PackagingTests
      - run: |
          swift build --scratch-path build/swift -c release
          xcrun swiftc -swift-version 5 Tools/TLSFixture/main.swift -o build/tls-fixture
          python3 scripts/integration.py
          python3 scripts/test-native-transports.py
      - run: scripts/package-release.sh --dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MacDPI-local-review-only
          path: build/dist/
# Publishing is intentionally a separate manual maintainer operation after Developer ID
# signing, notarization, verification and explicit authorization. No release is created here.
